services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=botdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    networks:
      - telegram_net

  db:
    image: postgres:15
    container_name: telegram_db
    restart: always
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - telegram_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dbdata:

networks:
  telegram_net:
